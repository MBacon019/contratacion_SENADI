<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCP - Detalles del Proceso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tema-oscuro { background-color: #0f172a; color: #e2e8f0; }
        .tema-oscuro .bg-white, .tema-oscuro .bg-gray-50, .tema-oscuro .bg-gray-100, .tema-oscuro .bg-blue-50, .tema-oscuro .bg-amber-50 { background-color: #111827 !important; color: #e2e8f0 !important; }
        .tema-oscuro .text-gray-900, .tema-oscuro .text-gray-800, .tema-oscuro .text-gray-700, .tema-oscuro .text-gray-600, .tema-oscuro .text-gray-500, .tema-oscuro .text-gray-400 { color: #cbd5e1 !important; }
        .tema-oscuro .text-blue-600 { color: #7dd3fc !important; }
        .tema-oscuro .border-gray-200, .tema-oscuro .border-gray-100, .tema-oscuro .border-blue-100, .tema-oscuro .border-blue-200, .tema-oscuro .border-amber-200 { border-color: #334155 !important; }
        .tema-oscuro input, .tema-oscuro select, .tema-oscuro textarea { background-color: #1e293b !important; color: #e2e8f0 !important; border-color: #475569 !important; }
        .tema-oscuro input::placeholder, .tema-oscuro textarea::placeholder { color: #94a3b8 !important; }
        .tema-oscuro .hover\:bg-gray-50:hover { background-color: #1e293b !important; }
    </style>
</head>
<body class="bg-[#f4f7fc] font-sans antialiased text-gray-800">

    <header class="max-w-4xl mx-auto pt-6 px-4 flex justify-between items-center">
        <button onclick="regresarAlDashboard()" class="flex items-center space-x-2 text-gray-600 hover:text-gray-900 font-medium transition text-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            <span>Detalles del Proceso</span>
        </button>
    </header>

    <div class="max-w-4xl mx-auto px-4 mt-2 mb-4">
        <h2 id="subtitulo-proceso" class="text-xl font-bold text-gray-900 tracking-tight">Cargando proceso...</h2>
    </div>

    <main class="max-w-4xl mx-auto px-4 pb-12">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">

            <div class="bg-blue-600 text-white text-center py-6 px-4 space-y-1">
                <h3 class="text-lg font-bold uppercase tracking-wide">Actividad Específica</h3>
                <p class="text-xs text-blue-100">Define el nombre y detalles principales de este proceso</p>
            </div>

            <form id="form-actividad" class="p-6 space-y-6">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">No. de actividad en POA</label>
                        <div class="flex items-center space-x-2">
                            <input id="input-poa" type="text" readonly class="w-full border border-gray-200 bg-gray-50 rounded-xl px-4 py-2.5 text-sm text-gray-500 cursor-not-allowed font-mono font-bold">
                            <span class="text-[10px] text-gray-400 whitespace-nowrap">Auto-generado</span>
                        </div>
                    </div>
                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Estado</label>
                        <select id="select-estado" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                            <option value="nueva">Nueva</option>
                            <option value="en_proceso">En Proceso</option>
                            <option value="aprobada">Aprobada</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Actividad Específica *</label>
                    <textarea id="input-actividad" rows="3" placeholder="Ejemplo: SERVICIO DE MOVING DE LA INFRAESTRUCTURA DE SERVIDORES DE PRODUCCIÓN DEL SENADI" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition resize-none"></textarea>
                    <p class="text-[11px] text-gray-400 mt-0.5">Describe de manera clara y específica el objeto de la contratación.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1.5 relative">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Item</label>
                        <input id="input-item" type="text" placeholder="Ej: 1.1.01.01 o nombre del ítem"
                               autocomplete="off"
                               class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
                               oninput="buscarItem(this.value)" onblur="setTimeout(()=>cerrarDropdownItem(),200)">
                        <ul id="dropdown-item"
                            class="hidden absolute z-50 w-full bg-white border border-gray-200 rounded-xl shadow-lg mt-0.5 max-h-52 overflow-y-auto text-xs">
                        </ul>
                        <div id="item-seleccionado" class="hidden mt-1.5 bg-indigo-50 border border-indigo-200 rounded-xl px-3.5 py-2.5 flex justify-between items-start gap-2">
                            <div class="min-w-0">
                                <span id="item-sel-codigo" class="text-sm font-bold text-indigo-700 font-mono"></span>
                                <p id="item-sel-nombre" class="text-xs text-gray-600 mt-0.5 leading-relaxed break-words"></p>
                            </div>
                            <button type="button" onclick="limpiarItem()" class="text-gray-400 hover:text-red-500 flex-shrink-0 mt-0.5 transition" title="Quitar selección">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="space-y-1.5 relative">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">CPC</label>
                        <input id="input-cpc" type="text" placeholder="Buscar código o descripción CPC..."
                               autocomplete="off"
                               class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
                               oninput="buscarCPC(this.value)" onblur="setTimeout(()=>cerrarDropdownCPC(),200)">
                        <ul id="dropdown-cpc"
                            class="hidden absolute z-50 w-full bg-white border border-gray-200 rounded-xl shadow-lg mt-0.5 max-h-52 overflow-y-auto text-xs">
                        </ul>
                        <div id="cpc-seleccionado" class="hidden mt-1.5 bg-blue-50 border border-blue-200 rounded-xl px-3.5 py-2.5 flex justify-between items-start gap-2">
                            <div class="min-w-0">
                                <span id="cpc-sel-codigo" class="text-sm font-bold text-blue-700 font-mono"></span>
                                <p id="cpc-sel-desc" class="text-xs text-gray-600 mt-0.5 leading-relaxed break-words"></p>
                            </div>
                            <button type="button" onclick="limpiarCPC()" class="text-gray-400 hover:text-red-500 flex-shrink-0 mt-0.5 transition" title="Quitar selección">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="alerta-asignacion" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl px-4 py-3 flex items-start space-x-2">
                    <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span id="txt-alerta-asignacion"></span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">$ Asignación Presupuestaria</label>
                        <input id="input-asignacion" type="number" step="0.01" placeholder="$ 0.00" oninput="validarAsignacion()" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                        <p id="hint-umbral" class="text-[11px] text-gray-400"></p>
                    </div>
                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Cuatrimestre</label>
                        <select id="select-cuatrimestre" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                            <option value="C1">C1</option>
                            <option value="C2">C2</option>
                            <option value="C3">C3</option>
                        </select>
                    </div>
                </div>

                <div class="pt-2 border-t border-gray-100 space-y-4">
                    <div class="flex items-center space-x-2 text-gray-800">
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        <h4 class="text-sm font-bold tracking-wide">Responsables del Proceso</h4>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label class="block text-[11px] font-bold text-gray-600 uppercase">Elaborado por</label>
                            <select id="select-elaborado" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition bg-white">
                                <option value="">— Seleccionar —</option>
                                <option>Emerson Ceracapa</option>
                                <option>Gonzalo Moncayo</option>
                                <option>Juan Pablo Ponce</option>
                                <option>Marco Molina</option>
                                <option>María Fernanda Pilco</option>
                                <option>Michael Yanangómez</option>
                                <option>Miguel Cabrera</option>
                                <option>Paul Orozco</option>
                            </select>
                        </div>
                        <div class="space-y-1.5">
                            <label class="block text-[11px] font-bold text-gray-600 uppercase">Revisado por</label>
                            <select id="select-revisado" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition bg-white">
                                <option value="">— Seleccionar —</option>
                                <option>Emerson Ceracapa</option>
                                <option>Gonzalo Moncayo</option>
                                <option>Juan Pablo Ponce</option>
                                <option>Marco Molina</option>
                                <option>María Fernanda Pilco</option>
                                <option>Michael Yanangómez</option>
                                <option>Miguel Cabrera</option>
                                <option>Paul Orozco</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label class="block text-[11px] font-bold text-gray-600 uppercase">Aprobado por</label>
                            <select id="select-aprobado" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition bg-white">
                                <option value="">— Seleccionar —</option>
                                <option>Emerson Ceracapa</option>
                                <option>Gonzalo Moncayo</option>
                                <option>Juan Pablo Ponce</option>
                                <option>Marco Molina</option>
                                <option>María Fernanda Pilco</option>
                                <option>Michael Yanangómez</option>
                                <option>Miguel Cabrera</option>
                                <option>Paul Orozco</option>
                            </select>
                        </div>
                        <div class="space-y-1.5">
                            <label class="block text-[11px] font-bold text-gray-600 uppercase">Admin. de Contrato / Orden</label>
                            <select id="select-admin-contrato" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-500/20">
                                <option value="">— Seleccionar —</option>
                                <option>Gonzalo Moncayo</option>
                                <option>Miguel Cabrera</option>
                                
                            </select>
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="block text-[11px] font-bold text-gray-600 uppercase">Técnico Afín</label>
                        <input id="input-tecnico" type="text" placeholder="Nombre completo" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500/20">
                    </div>
                </div>

                <div class="pt-4 border-t border-gray-100 flex justify-between items-center">
                    <button type="button" onclick="regresarAlDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold py-2.5 px-5 rounded-xl transition">Cancelar</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 px-5 rounded-xl shadow-sm hover:shadow transition flex items-center space-x-2">
                        <span>Continuar a Configuración</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                    </button>
                </div>

            </form>
        </div>
    </main>

    <script>
        let umbralActivo = null;
        let tipoContratoActual = '';

        function aplicarColorTipoContrato() {
            const banner = document.querySelector('.bg-blue-600.text-white.text-center');
            if (!banner) return;
            const tipo = tipoContratoActual.toUpperCase();
            banner.classList.remove('bg-blue-600','bg-amber-500','bg-emerald-600','bg-purple-600');
            if (tipo.includes('ÍNFIMA') || tipo.includes('INFIMA')) {
                banner.classList.add('bg-blue-600');
            } else if (tipo.includes('CATÁLOGO') || tipo.includes('CATALOGO')) {
                banner.classList.add('bg-amber-500');
            } else if (tipo.includes('SUBASTA')) {
                banner.classList.add('bg-emerald-600');
            } else if (tipo.includes('RÉGIMEN') || tipo.includes('REGIMEN')) {
                banner.classList.add('bg-purple-600');
            } else {
                banner.classList.add('bg-blue-600');
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            initTema();
            const datosContrato = localStorage.getItem('contratoSeleccionado');
            if (datosContrato) {
                const contrato = JSON.parse(datosContrato);
                tipoContratoActual = contrato.nombre || '';
                aplicarColorTipoContrato();
                const nombreLimpio = tipoContratoActual.replace("Contrato ", "");
                document.getElementById('subtitulo-proceso').innerText = nombreLimpio;
            } else {
                regresarAlDashboard();
                return;
            }

            // Item 1: Auto-numerar POA con contador global que nunca retrocede
            const procesosActuales = JSON.parse(localStorage.getItem('instanciaProcesoEnProgreso') || '[]');
            const listaActual = Array.isArray(procesosActuales) ? procesosActuales : (procesosActuales ? [procesosActuales] : []);

            let contadorPOA = parseInt(localStorage.getItem('contadorPOA') || '0');
            if (contadorPOA === 0) {
                contadorPOA = listaActual.length;
            }
            const siguienteNumero = contadorPOA + 1;
            document.getElementById('input-poa').value = siguienteNumero;

            // Item 2: Cargar umbral activo
            try {
                const resp = await fetch('/api/umbrales/activo');
                umbralActivo = await resp.json();
                actualizarHintUmbral();
            } catch (e) {
                umbralActivo = { montoUmbral: 10000.0 };
            }
        });

        function actualizarHintUmbral() {
            if (!umbralActivo) return;
            const montoInfima = umbralActivo.montoUmbral;
            const montoSubasta = umbralActivo.montoSubastaMinimo != null
                ? umbralActivo.montoSubastaMinimo
                : umbralActivo.montoUmbral;
            const hint = document.getElementById('hint-umbral');
            const tipo = tipoContratoActual.toUpperCase();
            if (tipo.includes('ÍNFIMA') || tipo.includes('INFIMA')) {
                hint.textContent = `Ínfima Cuantía: máximo $${montoInfima.toLocaleString('es-EC', {minimumFractionDigits: 2})}`;
            } else if (tipo.includes('SUBASTA')) {
                hint.textContent = `Subasta: mínimo $${montoSubasta.toLocaleString('es-EC', {minimumFractionDigits: 2})}`;
            } else {
                hint.textContent = `Umbral referencial: $${montoInfima.toLocaleString('es-EC', {minimumFractionDigits: 2})} (año ${umbralActivo.anio || ''})`;
            }
        }

        function validarAsignacion() {
            if (!umbralActivo) return;
            const valor = parseFloat(document.getElementById('input-asignacion').value) || 0;
            const montoInfima = umbralActivo.montoUmbral;
            const montoSubasta = umbralActivo.montoSubastaMinimo != null
                ? umbralActivo.montoSubastaMinimo
                : umbralActivo.montoUmbral;
            const tipo = tipoContratoActual.toUpperCase();
            const alerta = document.getElementById('alerta-asignacion');
            const txtAlerta = document.getElementById('txt-alerta-asignacion');
            let error = '';

            if ((tipo.includes('ÍNFIMA') || tipo.includes('INFIMA')) && valor > montoInfima) {
                error = `La Ínfima Cuantía no puede superar $${montoInfima.toLocaleString('es-EC', {minimumFractionDigits: 2})}. Valor ingresado: $${valor.toLocaleString('es-EC', {minimumFractionDigits: 2})}.`;
            } else if (tipo.includes('SUBASTA') && valor > 0 && valor <= montoSubasta) {
                error = `La Subasta debe ser mayor a $${montoSubasta.toLocaleString('es-EC', {minimumFractionDigits: 2})}. Valor ingresado: $${valor.toLocaleString('es-EC', {minimumFractionDigits: 2})}.`;
            }

            if (error) {
                txtAlerta.textContent = error;
                alerta.classList.remove('hidden');
                document.getElementById('input-asignacion').classList.add('border-red-400');
            } else {
                alerta.classList.add('hidden');
                document.getElementById('input-asignacion').classList.remove('border-red-400');
            }
        }

        function regresarAlDashboard() { window.location.href = '/dashboard.html'; }

        function aplicarTema(oscuro) {
            document.body.classList.toggle('tema-oscuro', oscuro);
            localStorage.setItem('temaPreferido', oscuro ? 'oscuro' : 'claro');
        }
        function toggleTema() { aplicarTema(!document.body.classList.contains('tema-oscuro')); }
        function initTema() { if (localStorage.getItem('temaPreferido') === 'oscuro') aplicarTema(true); }

        document.getElementById('form-actividad').addEventListener('submit', (e) => {
            e.preventDefault();

            // Item 2: Bloquear submit si hay error de asignación
            if (!document.getElementById('alerta-asignacion').classList.contains('hidden')) {
                document.getElementById('alerta-asignacion').scrollIntoView({ behavior: 'smooth' });
                return;
            }

            // Validar campos obligatorios
            const fActividad = document.getElementById('input-actividad');
            const fAsignacion = document.getElementById('input-asignacion');
            const fElaborado = document.getElementById('select-elaborado');
            const fRevisado = document.getElementById('select-revisado');
            const fAprobado = document.getElementById('select-aprobado');
            const fAdmin = document.getElementById('select-admin-contrato');
            const fTecnico = document.getElementById('input-tecnico');
            [fActividad, fAsignacion, fElaborado, fRevisado, fAprobado, fAdmin, fTecnico].forEach(c => c.classList.remove('border-red-400'));

            let primerError = null;
            const marcar = (campo) => { campo.classList.add('border-red-400'); if (!primerError) primerError = campo; };

            if (!fActividad.value.trim()) marcar(fActividad);
            if (!(parseFloat(fAsignacion.value) > 0)) marcar(fAsignacion);
            if (!fElaborado.value) marcar(fElaborado);
            if (!fRevisado.value) marcar(fRevisado);
            if (!fAprobado.value) marcar(fAprobado);
            if (!fAdmin.value) marcar(fAdmin);
            if (!fTecnico.value.trim()) marcar(fTecnico);

            if (primerError) {
                document.getElementById('txt-alerta-asignacion').textContent = 'Por favor completa todos los campos obligatorios antes de continuar.';
                document.getElementById('alerta-asignacion').classList.remove('hidden');
                primerError.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }

            // Item 4: Guardar también nombre de item y descripción de CPC
            const detallesActividad = {
                noPoa: document.getElementById('input-poa').value,
                estado: document.getElementById('select-estado').value,
                actividadEspecifica: document.getElementById('input-actividad').value,
                item: document.getElementById('input-item').value,
                itemNombre: document.getElementById('item-sel-nombre').textContent || '',
                cpc: document.getElementById('input-cpc').value,
                cpcDescripcion: document.getElementById('cpc-sel-desc').textContent || '',
                asignacion: document.getElementById('input-asignacion').value,
                cuatrimestre: document.getElementById('select-cuatrimestre').value,
                elaborado: document.getElementById('select-elaborado').value,
                revisado: document.getElementById('select-revisado').value,
                aprobado: document.getElementById('select-aprobado').value,
                adminContrato: document.getElementById('select-admin-contrato').value,
                tecnico: document.getElementById('input-tecnico').value
            };

            localStorage.setItem('detallesActividad', JSON.stringify(detallesActividad));
            localStorage.setItem('ultimoAdminSeleccionado', detallesActividad.adminContrato);

            const contratoActual = localStorage.getItem('contratoSeleccionado');
            if (contratoActual) localStorage.setItem('contratoSeleccionado', contratoActual);

            localStorage.setItem('contadorPOA', siguienteNumero);
            window.location.href = '/configurar-flujo.html';
        });

        // Limpiar borde rojo al editar cada campo obligatorio
        ['input-actividad', 'input-asignacion', 'input-tecnico'].forEach(id => {
            document.getElementById(id).addEventListener('input', function() { this.classList.remove('border-red-400'); });
        });
        ['select-elaborado', 'select-revisado', 'select-aprobado', 'select-admin-contrato'].forEach(id => {
            document.getElementById(id).addEventListener('change', function() { this.classList.remove('border-red-400'); });
        });
    </script>

    <script>
        // ── AUTOCOMPLETE CPC ──────────────────────────────────────────────────
        let _cpcTimer = null;

        function buscarCPC(valor) {
            clearTimeout(_cpcTimer);
            const dropdown = document.getElementById('dropdown-cpc');
            // Ocultar recuadro de selección mientras el usuario escribe de nuevo
            document.getElementById('cpc-seleccionado').classList.add('hidden');
            if (valor.trim().length < 2) { dropdown.classList.add('hidden'); return; }

            _cpcTimer = setTimeout(async () => {
                try {
                    const lista = await fetch(`/api/cpc/buscar?q=${encodeURIComponent(valor.trim())}`).then(r => r.json());
                    if (!lista.length) { dropdown.classList.add('hidden'); return; }

                    dropdown.innerHTML = lista.map(c => `
                        <li onclick="seleccionarCPC('${escapar(c.codigo)}', '${escapar(c.descripcion)}')"
                            class="px-4 py-2.5 hover:bg-blue-50 cursor-pointer border-b border-gray-50 last:border-0 flex justify-between items-center gap-2">
                            <span class="min-w-0">
                                <strong class="text-blue-600 font-mono">${c.codigo}</strong>
                                <span class="text-gray-500 ml-1.5">— ${c.descripcion}</span>
                            </span>
                            ${c.umbralVae != null ? `<span class="text-[10px] text-gray-400 flex-shrink-0 ml-2">$${c.umbralVae.toLocaleString()}</span>` : ''}
                        </li>`).join('');
                    dropdown.classList.remove('hidden');
                } catch { dropdown.classList.add('hidden'); }
            }, 300);
        }

        function seleccionarCPC(codigo, descripcion) {
            document.getElementById('input-cpc').value = codigo;
            cerrarDropdownCPC();
            document.getElementById('cpc-sel-codigo').textContent = codigo;
            document.getElementById('cpc-sel-desc').textContent = descripcion;
            document.getElementById('cpc-seleccionado').classList.remove('hidden');
        }

        function limpiarCPC() {
            document.getElementById('input-cpc').value = '';
            document.getElementById('cpc-seleccionado').classList.add('hidden');
            document.getElementById('input-cpc').focus();
        }

        function cerrarDropdownCPC() {
            document.getElementById('dropdown-cpc').classList.add('hidden');
        }

        function escapar(str) {
            return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        // ─────────────────────────────────────────────────────────────────────
    </script>

    <script>
        // ── AUTOCOMPLETE ITEM ─────────────────────────────────────────────────
        let _itemTimer = null;

        function buscarItem(valor) {
            clearTimeout(_itemTimer);
            const dropdown = document.getElementById('dropdown-item');
            document.getElementById('item-seleccionado').classList.add('hidden');
            if (valor.trim().length < 2) { dropdown.classList.add('hidden'); return; }

            _itemTimer = setTimeout(async () => {
                try {
                    const lista = await fetch(`/api/item/buscar?q=${encodeURIComponent(valor.trim())}`).then(r => r.json());
                    if (!lista.length) { dropdown.classList.add('hidden'); return; }

                    dropdown.innerHTML = lista.map(c => `
                        <li onclick="seleccionarItem('${escapar(c.codigoCompleto)}', '${escapar(c.nombre)}')"
                            class="px-4 py-2.5 hover:bg-indigo-50 cursor-pointer border-b border-gray-50 last:border-0 flex items-center gap-2">
                            <span class="min-w-0">
                                <strong class="text-indigo-600 font-mono">${c.codigoCompleto}</strong>
                                <span class="text-gray-500 ml-1.5">— ${c.nombre}</span>
                            </span>
                        </li>`).join('');
                    dropdown.classList.remove('hidden');
                } catch { dropdown.classList.add('hidden'); }
            }, 300);
        }

        function seleccionarItem(codigoCompleto, nombre) {
            document.getElementById('input-item').value = codigoCompleto;
            cerrarDropdownItem();
            document.getElementById('item-sel-codigo').textContent = codigoCompleto;
            document.getElementById('item-sel-nombre').textContent = nombre;
            document.getElementById('item-seleccionado').classList.remove('hidden');
        }

        function limpiarItem() {
            document.getElementById('input-item').value = '';
            document.getElementById('item-seleccionado').classList.add('hidden');
            document.getElementById('input-item').focus();
        }

        function cerrarDropdownItem() {
            document.getElementById('dropdown-item').classList.add('hidden');
        }
        // ─────────────────────────────────────────────────────────────────────
    </script>
</body>
</html>
