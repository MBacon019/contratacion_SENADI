<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCP - Detalles del Proceso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tema-oscuro { background-color: #0f172a; color: #e2e8f0; }
        .tema-oscuro .bg-white, .tema-oscuro .bg-gray-50, .tema-oscuro .bg-gray-100, .tema-oscuro .bg-blue-50, .tema-oscuro .bg-amber-50 { background-color: #111827 !important; color: #e2e8f0 !important; }
        .tema-oscuro .text-gray-900, .tema-oscuro .text-gray-800, .tema-oscuro .text-gray-700, .tema-oscuro .text-gray-600, .tema-oscuro .text-gray-500, .tema-oscuro .text-gray-400 { color: #cbd5e1 !important; }
        .tema-oscuro .text-blue-600 { color: #7dd3fc !important; }
        .tema-oscuro .border-gray-200, .tema-oscuro .border-gray-100, .tema-oscuro .border-blue-100, .tema-oscuro .border-blue-200, .tema-oscuro .border-amber-200 { border-color: #334155 !important; }
        .tema-oscuro input, .tema-oscuro select, .tema-oscuro textarea { background-color: #1e293b !important; color: #e2e8f0 !important; border-color: #475569 !important; }
        .tema-oscuro input::placeholder, .tema-oscuro textarea::placeholder { color: #94a3b8 !important; }
        .tema-oscuro .bg-blue-50\/60, .tema-oscuro .bg-white\/20, .tema-oscuro .bg-white\/30, .tema-oscuro .bg-blue-700\/60, .tema-oscuro .bg-blue-700\/50, .tema-oscuro .bg-blue-900\/40, .tema-oscuro .bg-blue-900\/30 { background-color: rgba(30, 41, 59, 0.35) !important; }
        .tema-oscuro .hover\:bg-gray-50:hover { background-color: #1e293b !important; }
    </style>
</head>
<body class="bg-[#f4f7fc] font-sans antialiased text-gray-800">

    <header class="max-w-4xl mx-auto pt-6 px-4 flex justify-between items-center">
        <button onclick="regresarAlDashboard()" class="flex items-center space-x-2 text-gray-600 hover:text-gray-900 font-medium transition text-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            <span>Detalles del Proceso</span>
        </button>
        <button id="theme-toggle" onclick="toggleTema()" class="bg-white border border-gray-200 px-3 py-1 rounded-lg text-xs font-semibold text-gray-500 shadow-sm flex items-center space-x-1 hover:bg-gray-50 transition">
            <span class="w-2 h-2 rounded-full bg-amber-400"></span>
            <span id="theme-label">Claro</span>
        </button>
    </header>

    <div class="max-w-4xl mx-auto px-4 mt-2 mb-4">
        <h2 id="subtitulo-proceso" class="text-xl font-bold text-gray-900 tracking-tight">Cargando proceso...</h2>
    </div>

    <main class="max-w-4xl mx-auto px-4 pb-12">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            
            <div class="bg-blue-600 text-white text-center py-6 px-4 space-y-1">
                <h3 class="text-lg font-bold uppercase tracking-wide">Actividad Específica</h3>
                <p class="text-xs text-blue-100">Define el nombre y detalles principales de este proceso</p>
            </div>

            <form id="form-actividad" class="p-6 space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">No. de actividad en POA *</label>
                        <input id="input-poa" type="text" placeholder="Ej: 1, 2, 3..." class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                    </div>
                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Estado</label>
                        <select id="select-estado" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                            <option value="nueva">b. Nueva</option>
                            <option value="en_proceso">En Proceso</option>
                            <option value="aprobada">Aprobada</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Actividad Específica *</label>
                    <textarea id="input-actividad" rows="3" placeholder="Ejemplo: SERVICIO DE MOVING DE LA INFRAESTRUCTURA..." class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition resize-none"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Item</label>
                        <input id="input-item" type="text" placeholder="Código ITEM" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                    </div>
                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">CPC</label>
                        <input id="input-cpc" type="text" placeholder="Código CPC" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">$ Asignación Presupuestaria</label>
                        <input id="input-asignacion" type="number" step="0.01" placeholder="$ 0.00" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                    </div>
                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Cuatrimestre</label>
                        <select id="select-cuatrimestre" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                            <option value="C1">C1</option>
                            <option value="C2">C2</option>
                            <option value="C3">C3</option>
                        </select>
                    </div>
                </div>

                <div class="pt-2 border-t border-gray-100 space-y-4">
                    <div class="flex items-center space-x-2 text-gray-800">
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        <h4 class="text-sm font-bold tracking-wide">Responsables del Proceso</h4>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label class="block text-[11px] font-bold text-gray-600 uppercase">Elaborado por</label>
                            <select id="select-elaborado" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-500/20">
                                <option value="">— Seleccionar —</option>
                                <option>Gonzalo Moncayo</option><option>Marco Molina</option>
                                <option>Juan Pablo Ponce</option><option>Emerson Ceracapa</option>
                                <option>María Fernanda Pilco</option><option>Michael Yanangómez</option>
                                <option>Miguel Cabrera</option><option>Paul Orozco</option>
                            </select>
                        </div>
                        <div class="space-y-1.5">
                            <label class="block text-[11px] font-bold text-gray-600 uppercase">Revisado por</label>
                            <select id="select-revisado" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-500/20">
                                <option value="">— Seleccionar —</option>
                                <option>Gonzalo Moncayo</option><option>Marco Molina</option>
                                <option>Juan Pablo Ponce</option><option>Emerson Ceracapa</option>
                                <option>María Fernanda Pilco</option><option>Michael Yanangómez</option>
                                <option>Miguel Cabrera</option><option>Paul Orozco</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label class="block text-[11px] font-bold text-gray-600 uppercase">Aprobado por</label>
                            <select id="select-aprobado" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-500/20">
                                <option value="">— Seleccionar —</option>
                                <option>Gonzalo Moncayo</option><option>Marco Molina</option>
                                <option>Juan Pablo Ponce</option><option>Emerson Ceracapa</option>
                                <option>María Fernanda Pilco</option><option>Michael Yanangómez</option>
                                <option>Miguel Cabrera</option><option>Paul Orozco</option>
                            </select>
                        </div>
                        <div class="space-y-1.5">
                            <label class="block text-[11px] font-bold text-gray-600 uppercase">Admin. de Contrato / Orden</label>
                            <select id="select-admin-contrato" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-500/20">
                                <option value="">— Seleccionar —</option>
                                <option>Gonzalo Moncayo</option><option>Marco Molina</option>
                                <option>Juan Pablo Ponce</option><option>Emerson Ceracapa</option>
                                <option>María Fernanda Pilco</option><option>Michael Yanangómez</option>
                                <option>Miguel Cabrera</option><option>Paul Orozco</option>
                            </select>
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="block text-[11px] font-bold text-gray-600 uppercase">Técnico Afín</label>
                        <input id="input-tecnico" type="text" placeholder="Nombre completo" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500/20">
                    </div>
                </div>

                <div class="pt-4 border-t border-gray-100 flex justify-between items-center">
                    <button type="button" onclick="regresarAlDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold py-2.5 px-5 rounded-xl transition">Cancelar</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 px-5 rounded-xl shadow-sm hover:shadow transition flex items-center space-x-2">
                        <span>Continuar a Configuración</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                    </button>
                </div>

            </form>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initTema();
            const datosContrato = localStorage.getItem('contratoSeleccionado');
            if (datosContrato) {
                const contrato = JSON.parse(datosContrato);
                const nombreLimpio = contrato.nombre.replace("Contrato ", "");
                document.getElementById('subtitulo-proceso').innerText = nombreLimpio;
            } else {
                regresarAlDashboard();
            }
        });

        function regresarAlDashboard() { window.location.href = '/dashboard.html'; }

        function aplicarTema(oscuro) {
            document.documentElement.classList.toggle('tema-oscuro', oscuro);
            document.body.classList.toggle('tema-oscuro', oscuro);
            const label = document.getElementById('theme-label');
            if (label) label.innerText = oscuro ? 'Oscuro' : 'Claro';
            localStorage.setItem('temaPreferido', oscuro ? 'oscuro' : 'claro');
        }

        function toggleTema() { aplicarTema(!document.body.classList.contains('tema-oscuro')); }
        function initTema() { if (localStorage.getItem('temaPreferido') === 'oscuro') aplicarTema(true); }

        document.getElementById('form-actividad').addEventListener('submit', (e) => {
            e.preventDefault();
            
            // AHORA SÍ ESTAMOS CAPTURANDO TODOS LOS DATOS
            const detallesActividad = {
                noPoa: document.getElementById('input-poa').value,
                estado: document.getElementById('select-estado').value,
                actividadEspecifica: document.getElementById('input-actividad').value,
                item: document.getElementById('input-item').value,
                cpc: document.getElementById('input-cpc').value,
                asignacion: document.getElementById('input-asignacion').value,
                cuatrimestre: document.getElementById('select-cuatrimestre').value,
                
                // Estos campos faltaban capturar:
                elaborado: document.getElementById('select-elaborado').value,
                revisado: document.getElementById('select-revisado').value,
                aprobado: document.getElementById('select-aprobado').value,
                adminContrato: document.getElementById('select-admin-contrato').value,
                tecnico: document.getElementById('input-tecnico').value
            };

            localStorage.setItem('detallesActividad', JSON.stringify(detallesActividad));
            localStorage.setItem('ultimoAdminSeleccionado', detallesActividad.adminContrato);

            const contratoActual = localStorage.getItem('contratoSeleccionado');
            if (contratoActual) localStorage.setItem('contratoSeleccionado', contratoActual);

            window.location.href = '/configurar-flujo.html';
        });
    </script>
</body>
</html>
