<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Contratación - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tema-oscuro { background-color: #0f172a; color: #e2e8f0; }
        .tema-oscuro .bg-white,
        .tema-oscuro .bg-gray-50,
        .tema-oscuro .bg-gray-100,
        .tema-oscuro .bg-blue-50,
        .tema-oscuro .bg-amber-50 {
            background-color: #111827 !important;
            color: #e2e8f0 !important;
        }
        .tema-oscuro .text-gray-900,
        .tema-oscuro .text-gray-800,
        .tema-oscuro .text-gray-700,
        .tema-oscuro .text-gray-600,
        .tema-oscuro .text-gray-500,
        .tema-oscuro .text-gray-400 {
            color: #cbd5e1 !important;
        }
        .tema-oscuro .text-blue-600 { color: #7dd3fc !important; }
        .tema-oscuro .border-gray-200,
        .tema-oscuro .border-gray-100,
        .tema-oscuro .border-blue-100,
        .tema-oscuro .border-blue-200,
        .tema-oscuro .border-amber-200 {
            border-color: #334155 !important;
        }
        .tema-oscuro input,
        .tema-oscuro select,
        .tema-oscuro textarea {
            background-color: #1e293b !important;
            color: #e2e8f0 !important;
            border-color: #475569 !important;
        }
        .tema-oscuro input::placeholder,
        .tema-oscuro textarea::placeholder {
            color: #94a3b8 !important;
        }
        .tema-oscuro .bg-blue-50\/60,
        .tema-oscuro .bg-white\/20,
        .tema-oscuro .bg-white\/30,
        .tema-oscuro .bg-blue-700\/60,
        .tema-oscuro .bg-blue-700\/50,
        .tema-oscuro .bg-blue-900\/40,
        .tema-oscuro .bg-blue-900\/30 {
            background-color: rgba(30, 41, 59, 0.35) !important;
        }
        .tema-oscuro .hover\:bg-gray-50:hover { background-color: #1e293b !important; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="fixed top-4 right-4 z-50">
        <button id="theme-toggle" onclick="toggleTema()" class="bg-white border border-gray-200 px-3 py-1 rounded-xl text-xs font-semibold text-gray-500 flex items-center space-x-1 shadow-sm hover:bg-gray-50 transition">
            <svg class="w-3.5 h-3.5 text-amber-500 fill-amber-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 4.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <span id="theme-label">Claro</span>
        </button>
    </div>
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Iniciar Sesión</h2>
        
        <div id="error-message" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 hidden">
            <span id="error-text" class="block sm:inline"></span>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Correo Electrónico</label>
                <input type="email" id="email" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                       placeholder="admin@correo.com">
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Contraseña</label>
                <input type="password" id="password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                       placeholder="••••••••">
            </div>

            <button type="submit" 
                    class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
                Ingresar
            </button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página se recargue
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');

            errorDiv.classList.add('hidden'); // Ocultar errores previos

            try {
                // Hacemos la petición POST a tu controlador Spring Boot
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // 1. Guardamos los datos del usuario en la sesión del navegador para usarlos en el Dashboard
                    localStorage.setItem('usuario', JSON.stringify(data));
                    
                    // 2. Redireccionamos de inmediato a la pantalla del panel principal
                    window.location.href = '/dashboard.html';
                } else {
                    // Si el backend responde con un error (401) o credenciales incorrectas
                    errorText.innerText = data.error || 'Error al iniciar sesión';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                // Si el servidor está apagado o no hay conexión
                errorText.innerText = 'No se pudo conectar con el servidor.';
                errorDiv.classList.remove('hidden');
            }
        });

        function aplicarTema(oscuro) {
            document.documentElement.classList.toggle('tema-oscuro', oscuro);
            document.body.classList.toggle('tema-oscuro', oscuro);
            const label = document.getElementById('theme-label');
            if (label) label.innerText = oscuro ? 'Oscuro' : 'Claro';
            localStorage.setItem('temaPreferido', oscuro ? 'oscuro' : 'claro');
        }

        function toggleTema() {
            const esOscuro = !document.body.classList.contains('tema-oscuro');
            aplicarTema(esOscuro);
        }

        function initTema() {
            const temaGuardado = localStorage.getItem('temaPreferido');
            if (temaGuardado === 'oscuro') {
                aplicarTema(true);
            }
        }

        initTema();
    </script>
</body>
</html>
