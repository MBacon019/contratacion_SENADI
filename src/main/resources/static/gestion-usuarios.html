<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - SENADI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .senadi-bg { background-color: #12336b; }
        .role-checkbox { accent-color: #2563eb; }
    </style>
    
    <script>
        const userDataRaw = localStorage.getItem('usuario');
        if (!userDataRaw) {
            window.location.replace('/login.html');
        } else {
            const ud = JSON.parse(userDataRaw);
            let rolesGuard = Array.isArray(ud.roles) ? ud.roles : (ud.rol ? [ud.rol] : ['ROLE_USER']);
            rolesGuard = rolesGuard.map(r => typeof r === 'string' ? r : r.nombre);
            
            if (!rolesGuard.includes('ROLE_SUPER_ADMIN') && !rolesGuard.includes('ROLE_ADMIN')) {
                window.location.replace('/dashboard.html');
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <nav class="senadi-bg text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    <span class="font-bold text-lg tracking-wide">SENADI | Administración de Accesos</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/dashboard.html" class="text-sm font-bold bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg transition">
                        ← Volver al Dashboard
                    </a>
                    <button onclick="cerrarSesion()" class="text-sm bg-red-500/80 hover:bg-red-500 px-4 py-2 rounded-lg transition font-bold">
                        Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="flex flex-col md:flex-row justify-between items-end mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Directorio de Usuarios Activos</h1>
                <p class="text-sm text-gray-500 mt-1">Registra nuevos funcionarios LDAP, asígnales roles o dales de baja.</p>
            </div>
            
            <div class="relative w-full md:w-72">
                <input type="text" id="buscador" onkeyup="filtrarTabla()" placeholder="Buscar por nombre o correo..." 
                       class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm">
                <svg class="w-4 h-4 text-gray-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>

        <div id="notificacion" class="hidden mb-4 p-4 rounded-lg text-sm font-medium transition-all"></div>

        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 mb-6">
            <h2 class="text-sm font-bold text-gray-800 mb-3 border-b border-gray-100 pb-2">➕ Registrar Nuevo Funcionario (Verificación LDAP)</h2>
            <form id="form-agregar-usuario" class="flex flex-col gap-2">
                <div class="flex flex-col md:flex-row gap-4 items-end">
                    
                    <div class="flex-1 w-full">
                        <label class="block text-[11px] font-bold text-gray-600 uppercase tracking-wide mb-1">Usuario LDAP</label>
                        <div class="flex space-x-2">
                            <input type="text" id="nuevo-username" required placeholder="Ej: jperez" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            <button type="button" onclick="verificarEnLdap()" class="bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100 font-bold px-4 py-2 rounded-lg transition text-xs whitespace-nowrap flex items-center space-x-1 shadow-sm">
                                <span>🔍 Verificar</span>
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex-1 w-full">
                        <label class="block text-[11px] font-bold text-gray-600 uppercase tracking-wide mb-1">Correo Institucional (Automático)</label>
                        <input type="email" id="nuevo-email" readonly placeholder="Se autocompletará tras verificar..." class="w-full bg-gray-100 border border-gray-200 text-gray-500 rounded-lg px-3 py-2 text-sm outline-none cursor-not-allowed">
                    </div>
                    
                    <button type="submit" id="btn-guardar-nuevo" disabled class="bg-gray-300 text-white cursor-not-allowed font-bold px-6 py-2 rounded-lg shadow-sm transition flex-shrink-0 text-sm h-[38px] flex items-center space-x-2">
                        <span>Añadir al Sistema</span>
                    </button>
                </div>
                
                <p id="ldap-feedback" class="text-xs font-bold hidden mt-1"></p>
            </form>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Funcionario</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Correo Institucional</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider w-1/3">Roles Asignados</th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="4" class="px-6 py-10 text-center text-gray-500">Cargando usuarios...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarUsuarios();
        });

        const ROLES_DISPONIBLES = [
            { id: 'ROLE_USER', nombre: 'Usuario Básico' },
            { id: 'ROLE_UNIDAD_REQUIRENTE', nombre: 'Unidad Requirente' },
            { id: 'ROLE_ADMIN_CONTRATO', nombre: 'Admin. Contrato' },
            { id: 'ROLE_SUPER_ADMIN', nombre: 'Super Administrador' }
        ];

        // --- 1. VERIFICAR LDAP Y AUTOCOMPLETAR ---
        async function verificarEnLdap() {
            const username = document.getElementById('nuevo-username').value.trim();
            const feedback = document.getElementById('ldap-feedback');
            const emailInput = document.getElementById('nuevo-email');
            const btnGuardar = document.getElementById('btn-guardar-nuevo');

            if (!username) {
                feedback.textContent = '⚠️ Escribe un usuario LDAP primero.';
                feedback.className = 'text-xs font-bold mt-1 text-amber-600';
                feedback.classList.remove('hidden');
                return;
            }

            feedback.textContent = '⏳ Verificando en directorio...';
            feedback.className = 'text-xs font-bold mt-1 text-blue-500';
            feedback.classList.remove('hidden');

            try {
                const response = await fetch(`/api/usuarios/ldap/verificar/${username}`);
                const data = await response.json();

                if (response.ok) {
                    feedback.textContent = '✅ ' + data.mensaje;
                    feedback.className = 'text-xs font-bold mt-1 text-emerald-600';
                    
                    // Autocompletar el correo
                    emailInput.value = data.email;
                    
                    // Desbloquear el botón de "Añadir al Sistema"
                    btnGuardar.disabled = false;
                    btnGuardar.classList.remove('bg-gray-300', 'cursor-not-allowed');
                    btnGuardar.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
                } else {
                    feedback.textContent = '❌ ' + (data.error || 'Usuario no encontrado en LDAP');
                    feedback.className = 'text-xs font-bold mt-1 text-red-600';
                    emailInput.value = '';
                    
                    // Bloquear el botón
                    btnGuardar.disabled = true;
                    btnGuardar.classList.add('bg-gray-300', 'cursor-not-allowed');
                    btnGuardar.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
                }
            } catch (error) {
                feedback.textContent = '❌ Error de red al intentar verificar el usuario.';
                feedback.className = 'text-xs font-bold mt-1 text-red-600';
            }
        }

        // Si el usuario escribe algo nuevo, bloqueamos el botón hasta que vuelva a verificar
        document.getElementById('nuevo-username').addEventListener('input', () => {
            const btnGuardar = document.getElementById('btn-guardar-nuevo');
            btnGuardar.disabled = true;
            btnGuardar.classList.add('bg-gray-300', 'cursor-not-allowed');
            btnGuardar.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
            document.getElementById('nuevo-email').value = '';
            document.getElementById('ldap-feedback').classList.add('hidden');
        });

        // --- 2. REGISTRAR EL USUARIO VERIFICADO ---
        document.getElementById('form-agregar-usuario').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('nuevo-username').value;
            const email = document.getElementById('nuevo-email').value;

            try {
                const response = await fetch('/api/auth/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        nombre: username, 
                        email: email, 
                        password: username + '2026*' // Contraseña de relleno (LDAP valida la real en el Login)
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    mostrarNotificacion(`Usuario ${username} registrado correctamente en el sistema.`, 'exito');
                    document.getElementById('form-agregar-usuario').reset();
                    document.getElementById('ldap-feedback').classList.add('hidden');
                    document.getElementById('btn-guardar-nuevo').disabled = true;
                    document.getElementById('btn-guardar-nuevo').classList.add('bg-gray-300', 'cursor-not-allowed');
                    document.getElementById('btn-guardar-nuevo').classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
                    cargarUsuarios(); // Refresca la tabla
                } else {
                    mostrarNotificacion(data.error || 'Este correo/usuario ya existe en el sistema.', 'error');
                }
            } catch (error) {
                mostrarNotificacion('No se pudo conectar con el servidor para registrar al usuario.', 'error');
            }
        });

        // --- 3. CARGA DE TABLA ---
        async function cargarUsuarios() {
            try {
                const response = await fetch('/api/usuarios');
                const usuarios = await response.json();
                
                const tbody = document.getElementById('tabla-usuarios');
                tbody.innerHTML = '';

                if(usuarios.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-10 text-center text-gray-500">No hay usuarios registrados aún.</td></tr>';
                    return;
                }

                usuarios.forEach(user => {
                    let rolesDelUsuario = [];
                    if (Array.isArray(user.roles)) {
                        rolesDelUsuario = user.roles.map(r => typeof r === 'string' ? r : r.nombre);
                    } else if (user.rol) {
                        rolesDelUsuario = [typeof user.rol === 'string' ? user.rol : user.rol.nombre];
                    }

                    let checkboxesRoles = ROLES_DISPONIBLES.map(r => {
                        const estaMarcado = rolesDelUsuario.includes(r.id) ? 'checked' : '';
                        return `
                            <label class="inline-flex items-center mt-1 mr-4 cursor-pointer">
                                <input type="checkbox" class="role-checkbox form-checkbox h-4 w-4 text-blue-600 rounded border-gray-300" 
                                       data-user-id="${user.id}" value="${r.id}" ${estaMarcado}>
                                <span class="ml-1.5 text-xs text-gray-700 font-medium">${r.nombre}</span>
                            </label>
                        `;
                    }).join('');

                    const inicial = user.nombreCompleto ? user.nombreCompleto.charAt(0).toUpperCase() : 'U';

                    const fila = `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="flex items-center">
                                    <div class="h-8 w-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold text-xs flex-shrink-0">
                                        ${inicial}
                                    </div>
                                    <div class="ml-3">
                                        <p class="text-sm font-bold text-gray-900">${user.nombreCompleto || 'Usuario LDAP'}</p>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 font-mono">
                                ${user.email}
                            </td>
                            <td class="px-6 py-3 text-sm">
                                <div class="flex flex-wrap">
                                    ${checkboxesRoles}
                                </div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <div class="flex justify-end space-x-2">
                                    <button onclick="actualizarRoles(${user.id}, '${user.nombreCompleto || 'Usuario'}')" 
                                            class="text-blue-700 bg-blue-50 border border-blue-100 hover:bg-blue-600 hover:text-white px-3 py-1.5 rounded-lg shadow-sm transition font-bold">
                                        Guardar Roles
                                    </button>
                                    <button onclick="eliminarUsuario(${user.id}, '${user.nombreCompleto || 'Usuario'}')" 
                                            class="text-red-600 bg-red-50 border border-red-100 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-lg shadow-sm transition font-bold">
                                        Eliminar
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += fila;
                });
            } catch (error) {
                mostrarNotificacion('Error al cargar la lista de usuarios. Verifica que Spring Boot esté ejecutándose.', 'error');
            }
        }

        // --- 4. GUARDAR ROLES Y ELIMINAR ---
        async function actualizarRoles(idUsuario, nombreFuncionario) {
            const checkboxesMarcados = document.querySelectorAll(`input[type="checkbox"][data-user-id="${idUsuario}"]:checked`);
            const rolesSeleccionados = Array.from(checkboxesMarcados).map(cb => cb.value);

            if(rolesSeleccionados.length === 0) {
                mostrarNotificacion('Un usuario debe tener al menos un rol asignado para poder ingresar al sistema.', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/usuarios/${idUsuario}/roles`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roles: rolesSeleccionados })
                });

                const data = await response.json();

                if (response.ok) {
                    mostrarNotificacion(`Roles actualizados correctamente para ${nombreFuncionario}`, 'exito');
                } else {
                    mostrarNotificacion(data.error || 'Error al actualizar los roles', 'error');
                }
            } catch (error) {
                mostrarNotificacion('No se pudo conectar con el servidor para actualizar.', 'error');
            }
        }

        async function eliminarUsuario(idUsuario, nombreFuncionario) {
            const confirmacion = confirm(`⚠️ ALERTA: ¿Estás seguro de que deseas eliminar permanentemente a "${nombreFuncionario}" del sistema de contratación?\n\nEsta acción no se puede deshacer.`);
            if (!confirmacion) return;

            try {
                const response = await fetch(`/api/usuarios/${idUsuario}`, { method: 'DELETE' });
                if (response.ok) {
                    mostrarNotificacion(`Usuario ${nombreFuncionario} eliminado permanentemente.`, 'exito');
                    cargarUsuarios(); // Refrescar la tabla
                } else {
                    const data = await response.json();
                    mostrarNotificacion(data.error || 'Error al eliminar el usuario', 'error');
                }
            } catch (error) {
                mostrarNotificacion('No se pudo conectar con el servidor para eliminar al usuario.', 'error');
            }
        }

        // --- 5. UTILIDADES ---
        function mostrarNotificacion(mensaje, tipo) {
            const div = document.getElementById('notificacion');
            div.textContent = mensaje;
            div.className = `mb-4 p-4 rounded-xl text-sm font-bold transition-all block shadow-sm ${tipo === 'exito' ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-red-100 text-red-800 border border-red-200'}`;
            setTimeout(() => { div.classList.add('hidden'); div.classList.remove('block'); }, 4000);
        }

        function filtrarTabla() {
            const input = document.getElementById("buscador").value.toLowerCase();
            const filas = document.getElementById("tabla-usuarios").getElementsByTagName("tr");
            for (let i = 0; i < filas.length; i++) {
                if (filas[i].cells.length === 1) continue; 
                let textoFila = filas[i].textContent.toLowerCase();
                filas[i].style.display = textoFila.includes(input) ? "" : "none";
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('usuario');
            localStorage.removeItem('rolActivo');
            window.location.replace('/login.html');
        }
    </script>
</body>
</html>
